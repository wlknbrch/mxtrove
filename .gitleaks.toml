title = "MxTrove publication scan"

[extend]
useDefault = true

[[allowlists]]
description = "Dropbox rule matches this identifier-to-identifier assignment; no literal credential is present."
regexTarget = "match"
regexes = ['''^\s*dropboxClientId:\s*dropboxClientId\s*$''']

[[allowlists]]
description = "The verification checklist phrase signature/MIME is documentation, not a credential."
regexTarget = "match"
regexes = ['''^inaccessible entities,\s+signature/MIME $''']
