services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_GOOGLE_DRIVE_CLIENT_ID: ${VITE_GOOGLE_DRIVE_CLIENT_ID}
        VITE_DROPBOX_CLIENT_ID: ${VITE_DROPBOX_CLIENT_ID:-}
        VITE_ONEDRIVE_CLIENT_ID: ${VITE_ONEDRIVE_CLIENT_ID:-}
        VITE_MEDIA_WORKER_URL: ${VITE_MEDIA_WORKER_URL}
        VITE_WEB_PUSH_PUBLIC_KEY: ${VITE_WEB_PUSH_PUBLIC_KEY}
        VITE_PWA_ENABLED: ${VITE_PWA_ENABLED:-true}
        VITE_ENABLE_DEMO_MODE: ${VITE_ENABLE_DEMO_MODE:-false}
        VITE_APP_URL: ${VITE_APP_URL}
        VITE_SOURCE_URL: ${VITE_SOURCE_URL:-https://github.com/wlknbrch/mxtrove}
        VITE_OPERATOR_NAME: ${VITE_OPERATOR_NAME:-Tom Maucksch}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-mxtrove@wlknbrch.com}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik-public}
      - traefik.http.services.mxshare-web.loadbalancer.server.port=80
      - traefik.http.routers.mxshare-web.rule=Host(`mxtrove.wlknbrch.com`)
      - traefik.http.routers.mxshare-web.entrypoints=websecure
      - traefik.http.routers.mxshare-web.priority=10
      - traefik.http.routers.mxshare-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.mxshare-web.middlewares=mxshare-security
      - traefik.http.routers.mxshare-web-www.rule=Host(`www.mxtrove.wlknbrch.com`)
      - traefik.http.routers.mxshare-web-www.entrypoints=websecure
      - traefik.http.routers.mxshare-web-www.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.mxshare-web-www.middlewares=mxshare-www-redirect,mxshare-security
      - traefik.http.middlewares.mxshare-www-redirect.redirectregex.regex=^https://www\\.mxtrove\\.wlknbrch\\.com/(.*)
      - traefik.http.middlewares.mxshare-www-redirect.redirectregex.replacement=https://mxtrove.wlknbrch.com/$${1}
      - traefik.http.middlewares.mxshare-www-redirect.redirectregex.permanent=true
      - traefik.http.routers.mxshare-legacy.rule=Host(`mxshare.wlknbrch.com`) || Host(`www.mxshare.wlknbrch.com`)
      - traefik.http.routers.mxshare-legacy.entrypoints=websecure
      - traefik.http.routers.mxshare-legacy.priority=200
      - traefik.http.routers.mxshare-legacy.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.mxshare-legacy.middlewares=mxshare-legacy-redirect,mxshare-security
      - traefik.http.middlewares.mxshare-legacy-redirect.redirectregex.regex=^https://(?:www\\.)?mxshare\\.wlknbrch\\.com/(.*)
      - traefik.http.middlewares.mxshare-legacy-redirect.redirectregex.replacement=https://mxtrove.wlknbrch.com/$${1}
      - traefik.http.middlewares.mxshare-legacy-redirect.redirectregex.permanent=true
      - traefik.http.middlewares.mxshare-security.headers.contenttypenosniff=true
      - traefik.http.middlewares.mxshare-security.headers.referrerpolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.mxshare-security.headers.stsseconds=31536000
      - traefik.http.middlewares.mxshare-security.headers.stsincludesubdomains=true

  media-worker:
    build:
      context: .
      dockerfile: services/media-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - ${WORKER_ENV_FILE:-deploy/mxshare.vps.env}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - mxshare-media-tmp:/tmp/mxshare
      - mxshare-protected-media:/data/mxshare-protected-media
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik-public}
      - traefik.http.services.mxshare-worker.loadbalancer.server.port=8080
      - traefik.http.routers.mxshare-worker.rule=Host(`mxtrove.wlknbrch.com`) && PathPrefix(`/worker`)
      - traefik.http.routers.mxshare-worker.entrypoints=websecure
      - traefik.http.routers.mxshare-worker.priority=100
      - traefik.http.routers.mxshare-worker.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.mxshare-worker.middlewares=mxshare-worker-strip,mxshare-worker-ratelimit,mxshare-security
      - traefik.http.middlewares.mxshare-worker-strip.stripprefix.prefixes=/worker
      - traefik.http.middlewares.mxshare-worker-ratelimit.ratelimit.average=100
      - traefik.http.middlewares.mxshare-worker-ratelimit.ratelimit.burst=200
      - traefik.http.middlewares.mxshare-worker-ratelimit.ratelimit.period=1m
      - traefik.http.routers.mxshare-social.rule=Host(`mxtrove.wlknbrch.com`) && (PathPrefix(`/social`) || PathPrefix(`/og`))
      - traefik.http.routers.mxshare-social.entrypoints=websecure
      - traefik.http.routers.mxshare-social.priority=110
      - traefik.http.routers.mxshare-social.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.mxshare-social.middlewares=mxshare-worker-ratelimit,mxshare-security

networks:
  traefik-public:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-public}

volumes:
  mxshare-media-tmp:
  mxshare-protected-media:
