name: ci

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  media-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/media-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/media-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}
      - name: Apply migrations and seed to a fresh database
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if supabase db start 2>&1 | tee "$RUNNER_TEMP/supabase-start.log"; then
              exit 0
            fi
            if ! grep -qiE 'toomanyrequests|too many requests|429|failed to pull docker image' "$RUNNER_TEMP/supabase-start.log"; then
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1
      - name: Run database tests
        run: supabase test db
      - if: always()
        name: Stop local Supabase database
        run: supabase stop --no-backup

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build web image
        run: |
          docker build \
            --build-arg VITE_SUPABASE_URL=https://example.supabase.co \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=test-publishable-key \
            --build-arg VITE_GOOGLE_DRIVE_CLIENT_ID=test.apps.googleusercontent.com \
            --build-arg VITE_DROPBOX_CLIENT_ID=test-dropbox \
            --build-arg VITE_ONEDRIVE_CLIENT_ID=test-onedrive \
            --build-arg VITE_MEDIA_WORKER_URL=https://example.test/worker \
            --build-arg VITE_WEB_PUSH_PUBLIC_KEY=test-vapid-public-key \
            --build-arg VITE_PWA_ENABLED=true \
            --build-arg VITE_ENABLE_DEMO_MODE=false \
            --build-arg VITE_APP_URL=https://example.test \
            --tag mxshare-web:ci .
      - name: Build media worker image
        run: docker build --file services/media-worker/Dockerfile --tag mxshare-media-worker:ci .
