name: ci

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  media-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/media-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/media-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
