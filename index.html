<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="MxTrove is a social working archive for musicians sharing demos, mixes, and release projects."
    />
    <meta name="application-name" content="MxTrove" />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#9d5cff" />
    <link rel="icon" type="image/png" href="/mxtrove-icon-no-bg.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="canonical" href="%VITE_APP_URL%" />
    <meta property="og:site_name" content="MxTrove" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="%VITE_APP_URL%" />
    <meta property="og:title" content="MxTrove" />
    <meta
      property="og:description"
      content="A social working archive for musicians sharing demos, mixes, unfinished releases, and version-aware posts."
    />
    <meta property="og:image" content="%VITE_APP_URL%/mxtrove-share-preview.png" />
    <meta property="og:image:secure_url" content="%VITE_APP_URL%/mxtrove-share-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="MxTrove share preview card with the MxTrove brand icon and product tagline."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MxTrove" />
    <meta
      name="twitter:description"
      content="Share music, share versions, and publish unfinished work beautifully."
    />
    <meta name="twitter:image" content="%VITE_APP_URL%/mxtrove-share-preview.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      try {
        const appearance = JSON.parse(localStorage.getItem("mxshare:appearance:v2") || "{}");
        const root = document.documentElement;
        root.dataset.theme = appearance.theme || "dark";
        root.dataset.accent = appearance.accent || "violet";
        root.dataset.density = appearance.interface_density || "comfortable";
        root.dataset.contrast = appearance.increase_contrast ? "high" : "normal";
        root.dataset.transparency = appearance.reduce_transparency ? "reduced" : "normal";
        root.dataset.motion = appearance.reduce_motion || appearance.reduced_motion ? "reduced" : "normal";
        root.dataset.textSize = appearance.larger_ui_text ? "large" : "normal";
      } catch {}
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "MxTrove",
        "url": "https://mxtrove.wlknbrch.com",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "description": "A social working archive for musicians sharing demos, mixes, unfinished releases, and version-aware posts."
      }
    </script>
    <title>MxTrove</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
